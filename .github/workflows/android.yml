name: Android

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # JDK 21: Robolectric needs it for Android 15+ framework jars; AGP needs 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Node.js and pnpm for building ッツ Ebook Reader; versions follow its own CI.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: third_party/ttu-ebook-reader/pnpm-lock.yaml

      # Also validates the Gradle wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests, release and test builds
        run: ./gradlew --stacktrace lintDebug testDebugUnitTest assembleRelease assembleInternal assembleDebug

      - name: Database schema unchanged (or exported as a new version)
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            git diff -- app/schemas | head -50
            echo "::error::The database schema changed. Raise the version in HonmaniDatabase, add a migration and its test (DatabaseMigrationTest), and commit the exported schema in app/schemas."
            exit 1
          fi

      - name: APK checks (16 KB alignment, bundled reader, permissions)
        run: |
          scripts/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk
          scripts/check-apk.sh app/build/outputs/apk/internal/app-internal.apk

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      # Installable test builds, signed with this runner's throwaway debug key. Each CI run has
      # a different key, so uninstall the previous build before installing a new one.
      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: honmani-test-apks
          path: |
            app/build/outputs/apk/internal/app-internal.apk
            app/build/outputs/apk/debug/app-debug.apk

  # The browser tests need only the reader's web build (:app:buildTtu), not the APKs, so they run
  # beside the Android build instead of after it.
  browser:
    name: Browser tests (tap bridge, ttu end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ubuntu-latest moved to 26.04, which Playwright has no Chromium build for yet.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: third_party/ttu-ebook-reader/pnpm-lock.yaml

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the reader (ッツ Ebook Reader with the patches)
        run: ./gradlew --stacktrace :app:buildTtu

      - name: Install the test dependencies
        working-directory: web-tests
        run: npm ci

      - name: Playwright version
        id: playwright
        working-directory: web-tests
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download only; the system libraries below come from apt on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Chromium
        working-directory: web-tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: web-tests
        run: npx playwright test

      # A test that failed and then passed on the retry is a flake: say so in the run summary.
      - name: Name flaky tests
        if: always()
        working-directory: web-tests
        run: node support/report-flaky.js test-results/results.json

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-reports
          path: |
            web-tests/playwright-report/
            web-tests/test-results/
          if-no-files-found: ignore
